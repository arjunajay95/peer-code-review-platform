services:
  # Backend API. Neon is the database — no database block here, it's
  # external and unmanaged by Render (D-26). Frontend is deployed
  # separately on Vercel.
  - type: web
    name: peer-code-review-platform
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    autoDeploy: true # deploys automatically on push to main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon pooled connection string, set in the Render dashboard
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # the deployed frontend origin (Vercel), set in the Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # test-mode until Phase 8 hardening
      - key: CLERK_PUBLISHABLE_KEY
        sync: false # test-mode until Phase 8 hardening
